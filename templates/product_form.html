{% extends "base.html" %}{% block title %}{{ 'Edit' if product else 'Add' }} Product{% endblock %}
{% block content %}
<h2 class="fw-bold mb-3">{{ 'Edit Product' if product else 'Add Product' }}</h2>
<div class="panel form-panel"><form method="post">
 <div class="mb-3"><label class="form-label">Product Name *</label><input class="form-control" name="product_name" required maxlength="150" value="{{ product.product_name if product else '' }}"></div>
 <div class="mb-3"><label class="form-label">Category</label><input class="form-control" name="category" maxlength="50" value="{{ product.category if product else '' }}"></div>
 <div class="mb-3"><label class="form-label">Price (₹) *</label><input class="form-control" type="number" min="0" step="0.01" name="price" required value="{{ product.price if product else '0.00' }}"></div>
 {% if not product %}<div class="mb-3"><label class="form-label">Opening Quantity *</label><input class="form-control" type="number" min="0" name="quantity" required value="0"></div>{% endif %}
 <div class="mb-3"><label class="form-label">Reorder Level *</label><input class="form-control" type="number" min="0" name="reorder_level" required value="{{ product.reorder_level if product else 5 }}"></div>
 <button class="btn btn-primary">Save Product</button> <a class="btn btn-light" href="{{ url_for('products') }}">Cancel</a>
</form></div>
{% endblock %}
